<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Support Assistant</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <script>
    tailwind.config = {
      theme: {
        extend: {

          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },

          colors: {
            primary: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          },

          boxShadow: {
            panel:
              '0 20px 40px -15px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(15, 23, 42, 0.06), 0 1px 3px 0 rgba(15, 23, 42, 0.04)',
          }
        }
      }
    }
  </script>


  <style>

    /* Chat scrollbar */

    .chat-scroll::-webkit-scrollbar {
      width: 5px;
    }

    .chat-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    .chat-scroll::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }


    /* Thinking animation */

    @keyframes pulse-dot {

      0%,
      80%,
      100% {
        transform: scale(0.6);
        opacity: 0.4;
      }

      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .typing-dot {
      animation: pulse-dot 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .typing-dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0s;
    }


    /* AI Markdown formatting */

    .ai-message p {
      margin-bottom: 8px;
    }

    .ai-message p:last-child {
      margin-bottom: 0;
    }

    .ai-message strong {
      font-weight: 700;
      color: #0f172a;
    }

    .ai-message ul {
      margin: 8px 0;
      padding-left: 20px;
      list-style-type: disc;
    }

    .ai-message ol {
      margin: 8px 0;
      padding-left: 20px;
      list-style-type: decimal;
    }

    .ai-message li {
      margin-bottom: 4px;
    }

    .ai-message h1,
    .ai-message h2,
    .ai-message h3 {
      font-weight: 700;
      margin-top: 10px;
      margin-bottom: 6px;
    }

    .ai-message code {
      background: #f1f5f9;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 12px;
    }

  </style>

</head>


<body
  class="bg-[#f8fafc] min-h-screen flex items-center justify-center p-4 font-sans text-slate-800 antialiased"
  style="
    background-image: radial-gradient(#e2e8f0 1.2px, transparent 1.2px);
    background-size: 24px 24px;
  "
>


  <!-- CHAT PANEL -->

  <main
    class="w-full max-w-[440px] h-[640px] bg-white rounded-2xl shadow-panel border border-slate-200/90 flex flex-col overflow-hidden relative"
  >


    <!-- HEADER -->

    <header
      class="px-5 py-4 bg-white border-b border-slate-100 flex items-center justify-between z-10 select-none"
    >

      <div class="flex items-center gap-3">


        <!-- AI ICON -->

        <div class="relative flex-shrink-0">

          <div
            class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-sky-400 flex items-center justify-center text-white shadow-sm"
          >

            <svg
              class="w-5 h-5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >

              <path d="M12 8V4H8"></path>

              <rect
                width="16"
                height="12"
                x="4"
                y="8"
                rx="2"
              ></rect>

              <path d="M2 14h2"></path>

              <path d="M20 14h2"></path>

              <path d="M15 13v2"></path>

              <path d="M9 13v2"></path>

            </svg>

          </div>


          <!-- Online indicator -->

          <span
            class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 border-2 border-white rounded-full"
          ></span>

        </div>


        <!-- HEADER TEXT -->

        <div>

          <h1
            class="text-sm font-bold text-slate-900 leading-snug"
          >
            AI Support Assistant
          </h1>

          <div
            class="flex items-center gap-1.5 text-xs text-slate-500"
          >

            <span
              class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"
            ></span>

            <span>
              Online & ready to help
            </span>

          </div>

        </div>

      </div>


      <!-- HEADER BUTTONS -->

      <div class="flex items-center gap-1">

        <button
          type="button"
          aria-label="Minimize"
          class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors"
        >

          <svg
            class="w-4 h-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >

            <path d="M5 12h14"></path>

          </svg>

        </button>


        <button
          type="button"
          aria-label="Close"
          class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors"
        >

          <svg
            class="w-4 h-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >

            <path d="M18 6 6 18"></path>

            <path d="m6 6 12 12"></path>

          </svg>

        </button>

      </div>

    </header>



    <!-- CHAT AREA -->

    <section
      id="chat-messages"
      class="flex-1 overflow-y-auto p-5 space-y-4 chat-scroll bg-slate-50/50"
    >


      <!-- TODAY -->

      <div class="flex justify-center">

        <span
          class="px-2.5 py-1 text-[11px] font-medium text-slate-400 bg-white/80 border border-slate-200/60 rounded-full"
        >
          Today
        </span>

      </div>


      <!-- INITIAL AI MESSAGE -->

      <div class="flex items-start gap-2.5">

        <div
          class="w-7 h-7 rounded-lg bg-sky-100 text-sky-700 flex items-center justify-center flex-shrink-0 text-xs font-bold mt-0.5 border border-sky-200/70"
        >
          AI
        </div>

        <div
          class="max-w-[85%] bg-white text-slate-800 border border-slate-200/80 rounded-2xl rounded-tl-sm px-4 py-3 text-sm leading-relaxed shadow-xs"
        >

          <p>
            Hello! I'm your AI Support Assistant. Ask me anything about our services, materials, turnaround times, or order tracking.
          </p>

        </div>

      </div>



      <!-- THINKING INDICATOR -->

      <div
        id="loading-indicator"
        class="hidden flex items-start gap-2.5"
      >

        <div
          class="w-7 h-7 rounded-lg bg-sky-100 text-sky-700 flex items-center justify-center flex-shrink-0 text-xs font-bold mt-0.5 border border-sky-200/70"
        >
          AI
        </div>


        <div
          class="bg-white border border-slate-200/80 rounded-2xl rounded-tl-sm px-4 py-3 shadow-xs flex items-center gap-3"
        >

          <span class="text-xs font-medium text-slate-500">
            Thinking...
          </span>


          <div class="flex items-center gap-1 pt-0.5">

            <span
              class="w-1.5 h-1.5 bg-sky-500 rounded-full typing-dot"
            ></span>

            <span
              class="w-1.5 h-1.5 bg-sky-500 rounded-full typing-dot"
            ></span>

            <span
              class="w-1.5 h-1.5 bg-sky-500 rounded-full typing-dot"
            ></span>

          </div>

        </div>

      </div>

    </section>



    <!-- INPUT AREA -->

    <footer
      class="p-3 bg-white border-t border-slate-100"
    >

      <!-- IMPORTANT: FORM -->

      <form
        id="chat-form"
        class="flex items-center gap-2"
      >

        <input
          type="text"
          id="user-input"
          placeholder="Ask something about ELACE 3D Labs..."
          autocomplete="off"
          class="flex-1 pl-3.5 pr-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 focus:bg-white transition-all"
        />


        <button
          type="submit"
          id="send-button"
          aria-label="Send message"
          class="w-10 h-10 rounded-xl bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white flex items-center justify-center flex-shrink-0 transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
        >

          <svg
            class="w-4 h-4 ml-0.5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >

            <line
              x1="22"
              y1="2"
              x2="11"
              y2="13"
            ></line>

            <polygon
              points="22 2 15 22 11 13 2 9 22 2"
            ></polygon>

          </svg>

        </button>

      </form>


      <!-- FOOTER STATUS -->

      <div
        class="flex items-center justify-between px-1 pt-1.5 text-[11px] text-slate-400 select-none"
      >

        <span>
          Press
          <kbd
            class="font-sans px-1 py-0.5 text-[10px] bg-slate-100 border border-slate-200 rounded text-slate-500"
          >
            Enter
          </kbd>
          to send
        </span>


        <span class="flex items-center gap-1">

          <span
            class="w-1.5 h-1.5 rounded-full bg-emerald-500"
          ></span>

          <span>
            FastAPI Connected
          </span>

        </span>

      </div>

    </footer>

  </main>



  <!-- MARKED.JS -->

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>


  <script>

    // ==========================================
    // GET HTML ELEMENTS
    // ==========================================

    const chatContainer =
      document.getElementById("chat-messages");

    const chatForm =
      document.getElementById("chat-form");

    const userInput =
      document.getElementById("user-input");

    const sendButton =
      document.getElementById("send-button");

    const loadingIndicator =
      document.getElementById("loading-indicator");



    // ==========================================
    // SCROLL TO BOTTOM
    // ==========================================

    function scrollToBottom() {

      chatContainer.scrollTo({

        top: chatContainer.scrollHeight,

        behavior: "smooth"

      });

    }



    // ==========================================
    // MAIN CHAT FUNCTION
    // ==========================================

    chatForm.addEventListener(
      "submit",
      async function (event) {

        // VERY IMPORTANT
        // Prevent normal HTML form submission

        event.preventDefault();


        // Get user question

        const question =
          userInput.value.trim();


        // Do nothing if empty

        if (!question) {
          return;
        }


        // ======================================
        // SHOW USER MESSAGE
        // ======================================

        appendUserMessage(question);


        // Clear input

        userInput.value = "";


        // Disable controls

        userInput.disabled = true;

        sendButton.disabled = true;


        // Show Thinking...

        showLoading(true);


        try {

          // ====================================
          // CALL FASTAPI
          // ====================================

          const response = await fetch(
            `http://127.0.0.1:8000/ask?query=${encodeURIComponent(question)}`
          );


          // Check server response

          if (!response.ok) {

            throw new Error(
              "Server returned HTTP " +
              response.status
            );

          }


          // Convert response to JSON

          const data =
            await response.json();


          // Hide Thinking...

          showLoading(false);


          // Get AI answer

          const answer =
            data.answer ||
            "Sorry, I could not find an answer to that question.";


          // Display AI answer

          appendAiMessage(answer);

        }


        catch (error) {

          console.error(
            "API Error:",
            error
          );


          // Hide Thinking...

          showLoading(false);


          // Show error

          appendAiMessage(
            "Sorry, I couldn't get a response right now. Please try again."
          );

        }


        // Enable controls again

        userInput.disabled = false;

        sendButton.disabled = false;


        // Put cursor back

        userInput.focus();

      }
    );



    // ==========================================
    // USER MESSAGE
    // ==========================================

    function appendUserMessage(text) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "flex justify-end";


      const bubble =
        document.createElement("div");

      bubble.className =
        "max-w-[85%] bg-slate-900 text-white rounded-2xl rounded-tr-sm px-4 py-2.5 text-sm leading-relaxed shadow-xs";


      // textContent is safe

      bubble.textContent = text;


      wrapper.appendChild(bubble);


      chatContainer.insertBefore(
        wrapper,
        loadingIndicator
      );


      scrollToBottom();

    }



    // ==========================================
    // AI MESSAGE
    // ==========================================

    function appendAiMessage(text) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "flex items-start gap-2.5";


      // AI avatar

      const avatar =
        document.createElement("div");

      avatar.className =
        "w-7 h-7 rounded-lg bg-sky-100 text-sky-700 flex items-center justify-center flex-shrink-0 text-xs font-bold mt-0.5 border border-sky-200/70";


      avatar.textContent = "AI";


      // Message card

      const card =
        document.createElement("div");

      card.className =
        "ai-message max-w-[85%] bg-white text-slate-800 border border-slate-200/80 rounded-2xl rounded-tl-sm px-4 py-3 text-sm leading-relaxed shadow-xs";


      // Convert Markdown to proper HTML

      if (typeof marked !== "undefined") {

        card.innerHTML =
          marked.parse(text);

      }

      else {

        card.textContent = text;

      }


      wrapper.appendChild(avatar);

      wrapper.appendChild(card);


      chatContainer.insertBefore(
        wrapper,
        loadingIndicator
      );


      scrollToBottom();

    }



    // ==========================================
    // THINKING INDICATOR
    // ==========================================

    function showLoading(show) {

      if (show) {

        loadingIndicator.classList.remove(
          "hidden"
        );

      }

      else {

        loadingIndicator.classList.add(
          "hidden"
        );

      }


      scrollToBottom();

    }

  </script>

</body>

</html>
